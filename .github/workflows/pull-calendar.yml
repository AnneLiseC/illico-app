# ⚠ DÉSACTIVÉ le 02/09 — ce cron vit désormais dans vercel.json.
#
# POURQUOI. Ces workflows existaient parce que le plan Vercel Hobby limitait les crons
# natifs. Le compte est passé en Pro : Vercel peut porter les quatre cadences lui-même.
# Les garder revenait à lancer DEUX fois le même travail — `pull-onedrive` tournait
# toutes les 15 min ici ET toutes les 30 min côté Vercel, soit ~1 440 exécutions
# inutiles par mois, et deux pollers concurrents sur le même curseur delta.
#
# Le déclencheur `schedule` est retiré ; `workflow_dispatch` reste pour un lancement
# manuel de dépannage. CE FICHIER PEUT ÊTRE SUPPRIMÉ — le pont n'a pas le droit de
# supprimer, il ne peut que le neutraliser.

name: Pull calendrier incrémental (DÉSACTIVÉ — voir vercel.json)

on:
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Pull incrémental
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 300 -X GET \
            "$APP_BASE_URL/api/cron/pull-google" \
            -H "Authorization: Bearer $CRON_SECRET"
