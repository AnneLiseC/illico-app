# .github/workflows/pull-calendar.yml
# B8 — déclenchement du pull calendrier INCRÉMENTAL Google -> BATILIS (B4-B6), toutes les 15 min.
# (Le balayage des RÉCURRENTS B7 est, lui, déclenché par Vercel Cron natif — cf. vercel.json.)
#
# ⚠️ INERTE tant que :
#   1) ce workflow n'est pas sur la branche PAR DÉFAUT (les schedules GitHub ne tournent que là) ;
#   2) les secrets repo ne sont pas définis :
#        APP_BASE_URL = URL de prod (ex. https://illico-app.vercel.app)  [PAS de / final]
#        CRON_SECRET  = même valeur que la variable d'env Vercel CRON_SECRET
# GitHub Cron est en UTC et peut être décalé de quelques minutes (best-effort).

name: Pull calendrier incrémental (Google -> BATILIS)

on:
  schedule:
    - cron: '*/15 * * * *'   # incrémental — toutes les 15 min
  workflow_dispatch:          # déclenchement manuel

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Pull incrémental
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 300 -X GET \
            "$APP_BASE_URL/api/cron/pull-google" \
            -H "Authorization: Bearer $CRON_SECRET"
