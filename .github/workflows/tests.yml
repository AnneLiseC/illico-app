# .github/workflows/tests.yml
# CI — lance les tests de non-régression (Vitest) à chaque Pull Request vers main
# et à chaque push sur main. Si un calcul de finance.js casse, le job passe au
# ROUGE et bloque le merge (une fois la branche protégée, cf. note plus bas).
#
# Aucun secret requis : les tests sont des fonctions pures (finance.js), pas
# d'appel réseau ni de base de données.
#
# Pour rendre le blocage OBLIGATOIRE : GitHub -> Settings -> Branches -> Add rule
# sur `main` -> cocher "Require status checks to pass" -> sélectionner "test".

name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install (npm ci)
        run: npm ci

      - name: Run tests
        run: npm test

      # Symboles non définis (no-undef) — ajouté le 16/09 après TROIS pannes trouvées le
      # même jour : getLogoBase64, TVA_FRAIS, nomDossier. Toutes les trois invisibles pour
      # `next build` et pour les tests, toutes les trois cassaient une fonction en
      # production. Voir eslint.undef.config.mjs pour le détail.
      #
      # Volontairement séparé de `npm run lint` : la config Next remonte déjà des erreurs
      # de style sur ce dépôt, et une CI rouge en permanence ne sert à rien. Cette étape-ci
      # est verte aujourd'hui, et ne passera au rouge que pour un symbole qui n'existe pas.
      - name: Symboles non définis
        run: npm run lint:undef
