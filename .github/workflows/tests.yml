# .github/workflows/tests.yml
# CI — lance les tests de non-régression (Vitest) à chaque Pull Request vers main
# et à chaque push sur main. Si un calcul de finance.js casse, le job passe au
# ROUGE et bloque le merge (une fois la branche protégée, cf. note plus bas).
#
# Aucun secret requis : les tests sont des fonctions pures (finance.js), pas
# d'appel réseau ni de base de données.
#
# Pour rendre le blocage OBLIGATOIRE : GitHub -> Settings -> Branches -> Add rule
# sur `main` -> cocher "Require status checks to pass" -> sélectionner "test".

name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install (npm ci)
        run: npm ci

      - name: Run tests
        run: npm test
