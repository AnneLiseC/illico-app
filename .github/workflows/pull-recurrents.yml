# .github/workflows/pull-recurrents.yml
# Pull des SÉRIES RÉCURRENTES Google -> BATILIS, toutes les heures.
# Complément gratuit du cron Vercel : sur le plan Vercel Hobby, les crons sont
# limités à 1x/jour. GitHub Actions (gratuit) autorise une cadence plus fine, donc
# c'est ici qu'on fait la synchro horaire des récurrents. Le cron Vercel quotidien
# (vercel.json, 3h) reste comme filet de secours.
#
# ⚠️ INERTE tant que :
#   1) ce workflow n'est pas sur la branche PAR DÉFAUT (les schedules GitHub ne tournent que là) ;
#   2) les secrets repo ne sont pas définis (les MÊMES que le pull incrémental) :
#        APP_BASE_URL = URL de prod (ex. https://illico-app.vercel.app)  [PAS de / final]
#        CRON_SECRET  = même valeur que la variable d'env Vercel CRON_SECRET
# GitHub Cron est en UTC et best-effort (peut décaler de quelques minutes).

name: Pull récurrents (Google -> BATILIS)

on:
  schedule:
    - cron: '0 * * * *'   # toutes les heures
  workflow_dispatch:       # déclenchement manuel (bouton "Run workflow" dans l'onglet Actions)

jobs:
  pull-recurrents:
    runs-on: ubuntu-latest
    steps:
      - name: Pull récurrents
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 300 -X GET \
            "$APP_BASE_URL/api/cron/pull-google-recurrents" \
            -H "Authorization: Bearer $CRON_SECRET"
