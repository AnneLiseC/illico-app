<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>illiCO travaux — Martigues · Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    /* Brand */
    --brand-900:#003d64;
    --brand-800:#00578e;
    --brand-500:#0094d4;
    --brand-50:#f0f7ff;

    /* Surface */
    --bg:#f4f7fb;
    --surface:#ffffff;
    --surface-2:#f8fafc;

    /* Ink */
    --ink-900:#0f2744;
    --ink-700:#334155;
    --ink-500:#64748b;
    --ink-400:#94a3b8;
    --ink-300:#cbd5e1;
    --ink-200:#e2e8f0;
    --ink-100:#eef2f7;

    /* Semantic */
    --ok:#16a34a;
    --warn:#f59e0b;
    --bad:#dc2626;
    --mute:#94a3b8;
    --info:#0094d4;

    /* Effects */
    --shadow-card:0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,87,142,0.08);
    --shadow-pop:0 1px 2px rgba(0,0,0,0.04), 0 10px 30px rgba(0,87,142,0.14);
    --radius:14px;
    --radius-sm:10px;
    --radius-xs:8px;

    --sidebar-w:72px;
    --sidebar-w-open:240px;

    /* Density */
    --row-pad-y:14px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink-700);font-family:'Manrope',system-ui,sans-serif;font-feature-settings:"ss01","cv11";-webkit-font-smoothing:antialiased}
  body{min-height:100vh;overflow-x:hidden}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-feature-settings:"tnum"}
  .tnum{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
  input,select,textarea{font-family:inherit;color:inherit}
  a{color:inherit;text-decoration:none}

  /* Section title (uppercase eyebrow) */
  .eyebrow{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--ink-400)}

  /* Page title */
  h1.page{font-size:24px;font-weight:700;color:var(--ink-900);margin:0;letter-spacing:-0.01em}
  h2.page{font-size:18px;font-weight:700;color:var(--ink-900);margin:0;letter-spacing:-0.01em}

  /* Card */
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-card);border:1px solid rgba(15,39,68,0.04)}

  /* Big number */
  .big-num{font-size:36px;font-weight:800;color:var(--brand-800);letter-spacing:-0.02em;line-height:1;white-space:nowrap}

  /* Scrollbars */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#cdd6e3;border-radius:99px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#94a3b8}

  /* App shell layout */
  .app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
  .main{min-width:0;display:flex;flex-direction:column}

  /* Header */
  .header{height:64px;background:var(--surface);border-bottom:1px solid var(--ink-200);display:flex;align-items:center;gap:16px;padding:0 28px;position:sticky;top:0;z-index:30}

  /* Pills, badges */
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;line-height:1.4}
  .badge .dot{width:6px;height:6px;border-radius:99px;background:currentColor}
  .badge-ok{background:rgba(22,163,74,0.10);color:#15803d}
  .badge-warn{background:rgba(245,158,11,0.13);color:#a16207}
  .badge-bad{background:rgba(220,38,38,0.10);color:#b91c1c}
  .badge-mute{background:rgba(148,163,184,0.18);color:#475569}
  .badge-info{background:rgba(0,148,212,0.12);color:#0078ad}
  .badge-brand{background:rgba(0,87,142,0.10);color:var(--brand-800)}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;transition:all 150ms ease;white-space:nowrap}
  .btn-primary{background:var(--brand-500);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,0.04),0 4px 12px rgba(0,148,212,0.30)}
  .btn-primary:hover{background:#007fb8;transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:var(--ink-700);border:1px solid var(--ink-200)}
  .btn-ghost:hover{background:var(--surface-2);border-color:var(--ink-300)}
  .btn-dark{background:var(--brand-800);color:#fff}
  .btn-dark:hover{background:#004a78}

  /* Inputs */
  .input{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--ink-300);background:#fff;font-size:13px;color:var(--ink-700);outline:none;transition:all 150ms ease}
  .input:focus{border-color:var(--brand-500);box-shadow:0 0 0 3px rgba(0,148,212,0.18)}
  .input::placeholder{color:var(--ink-400)}

  /* List row hover */
  .row-hover:hover{background:var(--brand-50)}

  /* Tab bar */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--ink-200)}
  .tab{padding:10px 14px;font-size:13px;font-weight:600;color:var(--ink-500);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;transition:color 150ms,border-color 150ms;white-space:nowrap}
  .tab:hover{color:var(--ink-700)}
  .tab.active{color:var(--brand-800);border-bottom-color:var(--brand-800)}

  /* Decorative arc on KPI corner */
  .deco-arc{position:absolute;top:-30px;left:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 70% 70%, rgba(0,148,212,0.14), rgba(0,148,212,0) 60%);pointer-events:none}

  /* Animations */
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .fade-in{animation:fadeIn 220ms ease both}

  /* Sidebar */
  .sidebar{position:relative;width:var(--sidebar-w);transition:width 200ms cubic-bezier(.2,.7,.2,1);z-index:40}
  .sidebar-inner{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:linear-gradient(180deg,var(--brand-800) 0%,var(--brand-900) 100%);color:#fff;display:flex;flex-direction:column;transition:width 200ms cubic-bezier(.2,.7,.2,1);overflow:hidden;box-shadow:1px 0 0 rgba(0,0,0,0.06)}
  .sidebar.open .sidebar-inner{width:var(--sidebar-w-open)}
  .sidebar.open + .main .header-spacer{display:none}
  .sidebar.pinned-open{width:var(--sidebar-w-open)}
  .sidebar.pinned-open .sidebar-inner{width:var(--sidebar-w-open)}
  .nav-item{display:flex;align-items:center;gap:14px;padding:11px 14px;margin:1px 12px;border-radius:10px;color:rgba(255,255,255,0.78);font-size:13.5px;font-weight:600;position:relative;transition:background 150ms,color 150ms;cursor:pointer;white-space:nowrap;overflow:hidden}
  .nav-item:hover{background:rgba(255,255,255,0.08);color:#fff}
  .nav-item.active{background:rgba(255,255,255,0.15);color:#fff}
  .nav-item.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:#fff;border-radius:0 3px 3px 0}
  .nav-icon{width:22px;height:22px;flex:0 0 22px;display:grid;place-items:center;color:currentColor}
  .nav-label{opacity:0;transform:translateX(-4px);transition:opacity 150ms ease,transform 150ms ease;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .sidebar.open .nav-label, .sidebar.pinned-open .nav-label{opacity:1;transform:none}
  .nav-badge{margin-left:auto;background:var(--brand-500);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;opacity:0;transition:opacity 150ms}
  .sidebar.open .nav-badge, .sidebar.pinned-open .nav-badge{opacity:1}
  .nav-badge-dot{position:absolute;right:14px;top:13px;width:8px;height:8px;background:var(--brand-500);border-radius:99px;border:2px solid var(--brand-800)}
  .sidebar.open .nav-badge-dot, .sidebar.pinned-open .nav-badge-dot{display:none}

  /* Logo block */
  .logo-block{display:flex;align-items:center;gap:10px;padding:18px 22px 12px;color:#fff}
  .logo-mark{width:32px;height:32px;border-radius:8px;background:#fff;display:grid;place-items:center;color:var(--brand-800);font-weight:800;font-size:14px;letter-spacing:-0.02em;flex:0 0 32px}
  .logo-text{font-weight:800;letter-spacing:-0.01em;font-size:15px;line-height:1;opacity:0;transition:opacity 150ms;white-space:nowrap}
  .logo-text .muted{display:block;font-size:10px;font-weight:600;letter-spacing:0.08em;color:rgba(255,255,255,0.55);margin-top:3px;text-transform:uppercase}
  .sidebar.open .logo-text, .sidebar.pinned-open .logo-text{opacity:1}

  /* Sidebar bottom user */
  .user-block{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,0.10);display:flex;align-items:center;gap:10px}
  .avatar{width:34px;height:34px;border-radius:99px;background:#fff;color:var(--brand-800);display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 34px;box-shadow:0 2px 6px rgba(0,0,0,0.2)}
  .user-meta{opacity:0;transition:opacity 150ms;min-width:0}
  .sidebar.open .user-meta, .sidebar.pinned-open .user-meta{opacity:1}
  .user-meta .name{font-size:13px;font-weight:700;line-height:1.2;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-meta .role{font-size:11px;color:rgba(255,255,255,0.6);margin-top:2px}

  /* Pin button */
  .pin{position:absolute;top:14px;right:14px;width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);display:none;align-items:center;justify-content:center;cursor:pointer;font-size:10px}
  .sidebar.open .pin, .sidebar.pinned-open .pin{display:flex}
  .pin:hover{background:rgba(255,255,255,0.18);color:#fff}

  /* Page transitions */
  .page-enter{animation:fadeIn 240ms cubic-bezier(.2,.7,.2,1) both}

  /* Sticky cell helpers */
  .grid-list{display:grid;grid-template-columns:1fr 420px;gap:20px;min-height:0}
  @media (max-width:1180px){.grid-list{grid-template-columns:1fr 360px}}
  @media (max-width:1000px){.grid-list{grid-template-columns:1fr}}

  /* Progress */
  .progress{height:6px;background:#e6edf6;border-radius:99px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--brand-500);border-radius:99px;transition:width 400ms ease}
  .progress.ok > span{background:var(--ok)}
  .progress.warn > span{background:var(--warn)}
  .progress.bad > span{background:var(--bad)}

  /* Stat decorations */
  .kpi{position:relative;overflow:hidden;padding:22px}
  .kpi .kpi-corner{position:absolute;top:0;right:0;width:80px;height:80px;opacity:0.5;pointer-events:none}
  .kpi-grid{display:grid;grid-template-columns:repeat(4, 1fr);gap:16px}
  @media (max-width:1100px){.kpi-grid{grid-template-columns:repeat(2, 1fr)}}
  @media (max-width:560px){.kpi-grid{grid-template-columns:1fr}}

  /* Mini sparkline cell */
  .sparkbar{display:inline-flex;align-items:flex-end;gap:2px;height:18px}
  .sparkbar span{width:3px;background:var(--brand-500);border-radius:1px;opacity:0.65}

  /* Avatar group */
  .av{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;border:2px solid #fff;flex:0 0 26px}

  /* Util */
  .clip-1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .clip-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .divide-x-200 > * + *{border-left:1px solid var(--ink-200)}

  /* Search shortcut */
  .kbd{display:inline-flex;align-items:center;justify-content:center;padding:1px 6px;border-radius:5px;background:#eef2f7;color:var(--ink-500);font-size:11px;font-weight:600;border:1px solid var(--ink-200)}

  /* Density tweak */
  body[data-density="compact"] .row-pad{padding-top:10px;padding-bottom:10px}
  body[data-density="comfortable"] .row-pad{padding-top:14px;padding-bottom:14px}
  body[data-density="cozy"] .row-pad{padding-top:18px;padding-bottom:18px}
</style>
</head>
